[package]
name = "mqtt-to-dbus"
version = "0.1.0"
edition = "2024"
type = "lib"

[dependencies]
clap = { version = "4.5.57", features = ["derive", "env"] }
async-trait = "0.1.92"
dbus = "0.9.12"
dbus-tokio = "0.7.6"
log = { version = "0.4.29" }
rumqttc = "0.25.1"
tokio = { version = "1.53.1", features = ["full"] }
uuid = { version = "1.26.1", features = ["v4"] }
