name: Release binaries

permissions:
  contents: write

on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

jobs:
  upload-assets:
    name: Upload binaries
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'mufasa71' }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve crate from release tag
        id: crate
        env:
          TAG: ${{ github.event.release.tag_name }}
        shell: python
        run: |
          import os, tomllib

          # Crates released via git tags only (not crates.io) get binaries.
          with open("release-plz.toml", "rb") as f:
              cfg = tomllib.load(f)
          crates = {p["name"] for p in cfg.get("package", []) if p.get("git_only")}

          crate = os.environ["TAG"].rsplit("-v", 1)[0]
          if crate in crates:
              with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                  out.write(f"name={crate}\n")
          else:
              print(f"No binaries to release for {os.environ['TAG']}")
      - name: Install packages
        if: steps.crate.outputs.name != ''
        run: sudo apt install -y libdbus-1-dev pkg-config
      - name: Install Rust toolchain
        if: steps.crate.outputs.name != ''
        uses: dtolnay/rust-toolchain@stable
      - name: Build and upload binary
        if: steps.crate.outputs.name != ''
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: ${{ steps.crate.outputs.name }}
          manifest-path: crates/${{ steps.crate.outputs.name }}/Cargo.toml
          target: x86_64-unknown-linux-gnu
          ref: refs/tags/${{ github.event.release.tag_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
