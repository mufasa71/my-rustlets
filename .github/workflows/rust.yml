name: Rust

on:
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install packages
        run: sudo apt install -y libdbus-1-dev pkg-config
      - name: Run tests
        run: cargo test
